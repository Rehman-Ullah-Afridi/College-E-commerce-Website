<!DOCTYPE html>
<html>
    <head>
        <title>E-commerce Website</title>
        <link rel="stylesheet" href= "styles/general.css">
        <link rel="stylesheet" href= "styles/header.css">
        <link rel="stylesheet" href= "styles/body.css">
        <link rel="stylesheet" href= "styles/footer.css">
    </head>
    <body>

        <!-- Header -->

        <header>
            <h1>
                ShopEasy
            </h1>
            <div>
                <p>
                    Home
                </p>
                <p>
                    Products
                </p>
                <p>
                    About
                </p>
                <p>
                    Contact
                </p>
            </div>
        </header>

        <!-- Body -->

        <main>
            <div class="first-section">
                <h1>
                    Welcome to ShopEasy
                </h1>
                <p>
                    Find the best products at affordable prices.
                </p>
                <button>
                    Shop Now
                </button>
            </div>

            <div class="second-section">
                <p class="heading">
                    Our Products
                </p>
                <div class="items">
                    <div class="item">
                        <img src="Images/headphone.webp">
                        <p class="item-name">
                            Headphones
                        </p>
                        <p class="item-price">
                            $25
                        </p>
                        <button>
                            Add to Cart
                        </button>
                    </div>
                    <div class="item">
                        <img src="Images/smw.JPG">
                        <p class="item-name">
                            Smart Watch
                        </p>
                        <p class="item-price">
                            $40
                        </p>
                        <button>
                            Add to Cart
                        </button>
                    </div>
                    <div class="item">
                        <img src="Images/sps.jpg">
                        <p class="item-name">
                            Sports Shoes
                        </p>
                        <p class="item-price">
                            $50
                        </p>
                        <button>
                            Add to Cart
                        </button>
                    </div>
                    <div class="item">
                        <img src="Images/bag.JPG">
                        <p class="item-name">
                            Backpack
                        </p>
                        <p class="item-price">
                            $30
                        </p>
                        <button>
                            Add to Cart
                        </button>
                    </div>
                </div>

            </div>
        </main>

        <!-- About Us -->

        <footer>
            
        </footer>
    </body>
</html>
